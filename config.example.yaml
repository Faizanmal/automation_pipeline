# Data Pipeline Configuration

companies:
  - name: UBS
    slug: ubs
    website: https://www.ubs.com
    keywords:
      - annual report
      - financial statements
      - earnings
      - investor relations
    seeds:
      - https://www.ubs.com/investors
      - https://www.ubs.com/en/wm/uob/news-and-insights.html

  - name: Goldman Sachs
    slug: gs
    website: https://www.goldmansachs.com
    keywords:
      - annual report
      - quarterly earnings
      - investor updates
    seeds:
      - https://www.goldmansachs.com/investor-relations/

  - name: JP Morgan
    slug: jpm
    website: https://www.jpmorganchase.com
    keywords:
      - annual report
      - financial results
      - investor information
    seeds:
      - https://investor.jpmorganchase.com/

# API Configuration - Multiple Providers (New Format)
# Supports multiple providers with automatic fallback
discovery_providers:
  - name: brave
    api_key: ${BRAVE_API_KEY}
    enabled: true
    priority: 1  # Lower number = higher priority
  - name: google
    api_key: ${GOOGLE_API_KEY}
    enabled: true
    priority: 2
    config:
      cx: ${GOOGLE_SEARCH_CX}  # Custom Search Engine ID
  - name: bing
    api_key: ${BING_API_KEY}
    enabled: false  # Disabled by default
    priority: 3

scraping_providers:
  - name: firecrawl
    api_key: ${FIRECRAWL_API_KEY}
    enabled: true
    priority: 1
  - name: scrapingbee
    api_key: ${SCRAPINGBEE_API_KEY}
    enabled: false  # Disabled by default
    priority: 2

# Legacy API Configuration (for backward compatibility)
# These will be automatically converted to provider format
brave_api_key: ${BRAVE_API_KEY}
firecrawl_api_key: ${FIRECRAWL_API_KEY}

# Pipeline Configuration
output_dir: output
max_concurrent_requests: 5
request_timeout_seconds: 30
max_retries: 3
log_level: INFO